[package]
name = "kvm-hello"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vmm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
event-manager = "0.4.2"
kvm-bindings = "0.14.1"
kvm-ioctls = "0.25.0"
libc = "0.2.189"
linux-loader = { version = "0.14.0", features = ["bzimage"] }
log = "0.4.34"
seccompiler = "0.5"
thiserror = "2.0.21"
virtio-bindings = "0.2.7"
vm-memory = { version = "0.18.0", features = ["backend-mmap"] }
vm-superio = "0.8.2"
vmm-sys-util = "0.15"

[dev-dependencies]
rexpect = "0.7.1"
tempfile = "3.27.0"
